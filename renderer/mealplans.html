<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>EasyCook - My Meal Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="banner">
        <img src="banner.png" alt="EasyCook Banner">
    </div>
    
    <h1>EasyCook</h1>
    <p>My Personal Meal Planner</p>

    <hr>

    <button id="homeButton">Recipe Finder</button>

    <h2>My Meal Plans</h2>

    <div id="mealPlanList">
        <p>You have no saved meal plans yet.</p>
    </div>

    <hr>

    <h2>Add a Meal Plan</h2>

    <label>Recipe Name:</label>
    <input type="text" id="mealName" placeholder="Enter recipe name">

    <br><br>

    <label>Cooking Date:</label>
    <input type="date" id="mealDate">

    <br><br>

    <label>Number of Servings:</label>
    <input type="number" id="mealServings" min="1" value="1">

    <br><br>

    <label>Estimated Cost Per Serving (RM):</label>
    <input type="number" id="mealCost" min="0" step="0.01">

    <br><br>

    <button id="addMealButton">Add Meal Plan</button>

    <p id="message"></p>
  
    <script src="mealplans.js"></script>

</body>
</html>
